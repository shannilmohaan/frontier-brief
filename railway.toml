[build]
builder = "nixpacks"

[deploy]
preDeployCommand = "LD_LIBRARY_PATH=$(find /nix -name 'libstdc++.so.6' 2>/dev/null | head -1 | xargs dirname) /opt/venv/bin/alembic upgrade head"
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
